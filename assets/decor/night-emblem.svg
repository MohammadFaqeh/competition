<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" fill="none">
  <!-- زخرفة يسار شاشة الدخول (ليل المسابقة): نجمة ثمانية متوهّجة وبداخلها مصحف على رحل، مع أبراج نجوم تلمع. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8b06a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e8b06a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- أبراج: خطوط رفيعة بين نجوم -->
  <g stroke="#e8b06a" stroke-opacity=".28" stroke-width="1.2">
    <path d="M40 70 L120 40 L190 88 L150 150"/>
    <path d="M430 60 L485 120 L455 190"/>
    <path d="M30 470 L95 515 L170 498"/>
    <path d="M470 430 L505 500"/>
  </g>
  <g fill="#f6d9a8">
    <circle cx="40" cy="70" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="40" r="4"><animate attributeName="opacity" values="1;.3;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="88" r="2.6"><animate attributeName="opacity" values=".4;1;.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="2.2"><animate attributeName="opacity" values=".9;.2;.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="60" r="3.2"><animate attributeName="opacity" values=".3;1;.3" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="485" cy="120" r="2.4"><animate attributeName="opacity" values="1;.35;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="190" r="3.6"><animate attributeName="opacity" values=".35;1;.35" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="470" r="2.8"><animate attributeName="opacity" values="1;.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="515" r="3.4"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="498" r="2.2"><animate attributeName="opacity" values=".8;.2;.8" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="430" r="2.6"><animate attributeName="opacity" values=".3;.9;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="505" cy="500" r="3"><animate attributeName="opacity" values="1;.25;1" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- هالة خلف الشعار -->
  <circle cx="260" cy="290" r="210" fill="url(#core)"/>

  <!-- النجمة الثمانية: خارجية متوهّجة + داخلية رفيعة -->
  <g transform="translate(260 290)">
    <g filter="url(#glow)" stroke="#e8b06a" stroke-width="7" stroke-linejoin="round">
      <rect x="-150" y="-150" width="300" height="300" fill="#0f1838" fill-opacity=".85"/>
      <rect x="-150" y="-150" width="300" height="300" transform="rotate(45)" fill="#0f1838" fill-opacity=".85"/>
    </g>
    <g stroke="#e8b06a" stroke-opacity=".45" stroke-width="2">
      <rect x="-120" y="-120" width="240" height="240"/>
      <rect x="-120" y="-120" width="240" height="240" transform="rotate(45)"/>
      <circle r="98"/>
    </g>

    <!-- مصحف مفتوح على رحل -->
    <g filter="url(#glow)">
      <path d="M-78 -30 Q-40 -58 0 -36 Q40 -58 78 -30 L78 40 Q40 18 0 40 Q-40 18 -78 40 Z" fill="#e8b06a"/>
      <path d="M0 -36 L0 40" stroke="#0f1838" stroke-width="4"/>
      <g stroke="#0f1838" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round">
        <path d="M-62 -14 Q-36 -32 -12 -18"/><path d="M-62 2 Q-36 -16 -12 -2"/><path d="M-62 18 Q-36 0 -12 14"/>
        <path d="M12 -18 Q36 -32 62 -14"/><path d="M12 -2 Q36 -16 62 2"/><path d="M12 14 Q36 0 62 18"/>
      </g>
      <g stroke="#e8b06a" stroke-width="9" stroke-linecap="round">
        <path d="M-58 52 L58 104"/><path d="M58 52 L-58 104"/>
      </g>
    </g>
  </g>
  <circle cx="260" cy="290" r="250" stroke="#e8b06a" stroke-opacity=".12" stroke-width="1.5" filter="url(#soft)"/>
</svg>
